<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#091428" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseRing {
        0% { r: 18px; opacity: 0.8; }
        50% { r: 32px; opacity: 0.2; }
        100% { r: 18px; opacity: 0.8; }
      }
      @keyframes radarSweep {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes particleFloat1 {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        50% { transform: translate(25px, -18px); opacity: 0.8; }
      }
      @keyframes particleFloat2 {
        0%, 100% { transform: translate(0, 0); opacity: 0.2; }
        50% { transform: translate(-20px, -22px); opacity: 0.7; }
      }
      @keyframes ecgLine {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      .card-float {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .pulse-elem {
        animation: pulseRing 3s ease-in-out infinite;
      }
      .particle-1 {
        animation: particleFloat1 5s ease-in-out infinite;
      }
      .particle-2 {
        animation: particleFloat2 7s ease-in-out infinite;
      }
      .ecg-anim {
        stroke-dasharray: 1000;
        animation: ecgLine 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Tech Grid Pattern in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Dynamic Glowing Mesh & ECG Wave in Bottom Background -->
  <path d="M 0 310 Q 150 280 300 310 T 600 310 T 900 310 T 1200 310" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.25" />
  <path d="M 0 315 L 200 315 L 220 285 L 235 345 L 250 305 L 265 325 L 275 315 L 600 315 L 620 285 L 635 345 L 650 305 L 665 325 L 675 315 L 1200 315"
        fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35" class="ecg-anim" />

  <!-- Animated Floating Data Particles (Deep Background Layer) -->
  <g>
    <circle cx="150" cy="80" r="4" fill="#38bdf8" class="particle-1" />
    <circle cx="1060" cy="70" r="5" fill="#818cf8" class="particle-2" />
    <circle cx="980" cy="280" r="4" fill="#00f2fe" class="particle-1" />
    <circle cx="80" cy="260" r="3.5" fill="#4facfe" class="particle-2" />
    <circle cx="1120" cy="220" r="3" fill="#38bdf8" class="particle-1" />
  </g>

  <!-- Left Dynamic Matching Node -->
  <g transform="translate(70, 140)">
    <circle cx="30" cy="30" r="28" fill="#0284c7" opacity="0.15" />
    <circle cx="30" cy="30" r="18" fill="none" stroke="#38bdf8" stroke-width="2" class="pulse-elem" />
    <circle cx="30" cy="30" r="7" fill="#38bdf8" filter="url(#glow)" />
    <!-- Connector Lines -->
    <path d="M 58 30 L 110 30" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" opacity="0.5" />
  </g>

  <!-- Right Dynamic Matching Node -->
  <g transform="translate(1040, 140)">
    <circle cx="30" cy="30" r="28" fill="#818cf8" opacity="0.15" />
    <circle cx="30" cy="30" r="18" fill="none" stroke="#a5b4fc" stroke-width="2" class="pulse-elem" />
    <circle cx="30" cy="30" r="7" fill="#818cf8" filter="url(#glow)" />
    <!-- Connector Lines -->
    <path d="M 2 30 L -50 30" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.5" />
  </g>

  <!-- FOREGROUND CONTENT: Header Title & Subtitles -->
  <!-- Top Badge / Pill -->
  <g transform="translate(435, 38)">
    <rect width="330" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text x="35" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      AI &amp; EHR ELIGIBILITY SCREENING
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="35" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Awesome Clinical Trial Patient Recruitment Sorters
  </text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="url(#textGrad)" letter-spacing="0.2">
    Precision Cohort Identification • EHR &amp; Genomics Parsing • LLM Criterion Verification
  </text>

  <!-- Subtitle Line 2 -->
  <text x="600" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Curated SaaS Platforms, Real-World Data Networks, and Validated Open-Source Trial Matchers
  </text>

  <!-- Interactive Dynamic Bottom Status Pills (Clear Foreground Alignment) -->
  <g transform="translate(240, 235)">
    <!-- Pill 1: OMOP & FHIR -->
    <g transform="translate(0, 0)">
      <rect width="165" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">
        ⚡ OMOP &amp; FHIR
      </text>
    </g>

    <!-- Pill 2: Deep NLP & LLMs -->
    <g transform="translate(185, 0)">
      <rect width="165" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
        🧠 NLP &amp; TrialGPT
      </text>
    </g>

    <!-- Pill 3: MatchMiner & SatIR -->
    <g transform="translate(370, 0)">
      <rect width="175" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="87" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">
        🔬 Precision Oncology
      </text>
    </g>

    <!-- Pill 4: HIPAA / Air-Gapped -->
    <g transform="translate(565, 0)">
      <rect width="155" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="77" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">
        🔒 HIPAA &amp; On-Prem
      </text>
    </g>
  </g>

  <!-- Bottom Accent Lightbar -->
  <rect x="350" y="322" width="500" height="2" rx="1" fill="url(#glowGrad)" filter="url(#glow)" />
</svg>
